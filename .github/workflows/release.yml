name: Release macOS App

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and attach assets to (e.g. v0.2.1)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  macos-arm64:
    name: Build & Publish macOS (arm64)
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo registry and build
        uses: Swatinem/rust-cache@v2

      - name: Run unit tests
        env:
          CARGO_PROFILE_DEV_DEBUG: "0"
          CARGO_PROFILE_TEST_DEBUG: "0"
        run: cargo test --no-default-features

      - name: Package release archive & SHA256SUMS
        run: ./scripts/release.sh "${GITHUB_REF_NAME:-${{ github.event.inputs.tag }}}" --package-only

      - name: Upload release assets to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/release.noindex/Piya-macos-*.zip dist/release.noindex/SHA256SUMS --clobber
          else
            gh release create "$TAG" \
              dist/release.noindex/Piya-macos-*.zip \
              dist/release.noindex/SHA256SUMS \
              --title "Piya ${TAG}" \
              --generate-notes
          fi
