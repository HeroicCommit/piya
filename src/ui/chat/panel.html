<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Piya</title>
<style>
  :root {
    --text: #1d1d1f;
    --muted: #6e6e73;
    --piya: #ec4899;
    --user: #007aff;
    --user-soft: rgba(0, 122, 255, 0.18);
    --border: rgba(0, 0, 0, 0.08);
    --surface: rgba(255, 255, 255, 0.38);
    --surface-strong: rgba(255, 255, 255, 0.52);
    --radius: 20px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --text: #f5f5f7;
      --muted: #98989d;
      --user-soft: rgba(10, 132, 255, 0.28);
      --border: rgba(255, 255, 255, 0.1);
      --surface: rgba(30, 30, 32, 0.38);
      --surface-strong: rgba(44, 44, 46, 0.55);
    }
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif;
    background: transparent;
    color: var(--text);
    overflow: hidden;
    border-radius: var(--radius);
  }
  .app {
    display: flex; flex-direction: column; height: 100vh;
    border-radius: var(--radius);
    overflow: hidden;
    background: transparent;
  }
  header {
    padding: 14px 16px 12px;
    background: var(--surface-strong);
    backdrop-filter: blur(24px) saturate(1.4);
    -webkit-backdrop-filter: blur(24px) saturate(1.4);
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 12px;
    -webkit-app-region: drag;
  }
  .avatar {
    width: 36px; height: 36px; border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, #f9a8d4, #ec4899);
    box-shadow: 0 2px 12px rgba(236, 72, 153, 0.4);
    flex-shrink: 0;
  }
  .title-block { flex: 1; min-width: 0; }
  header h1 { margin: 0; font-size: 16px; font-weight: 600; letter-spacing: -0.02em; }
  header p { margin: 2px 0 0; font-size: 12px; color: var(--muted); }
  .mode-switch {
    display: flex;
    background: var(--surface);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border-radius: 10px;
    padding: 3px; gap: 2px;
    border: 1px solid var(--border);
    -webkit-app-region: no-drag;
  }
  .mode-switch button {
    border: none; background: transparent; color: var(--muted);
    font-size: 11px; font-weight: 600; padding: 6px 14px;
    border-radius: 8px; cursor: pointer;
  }
  .mode-switch button.active {
    background: var(--surface-strong);
    color: var(--text);
    box-shadow: 0 1px 4px rgba(0, 0, 0, 0.08);
  }
  .mode-switch button.task.active { color: var(--piya); }
  .close-btn {
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--muted);
    width: 28px; height: 28px; border-radius: 50%;
    font-size: 16px; line-height: 1; cursor: pointer;
    flex-shrink: 0; -webkit-app-region: no-drag;
    display: flex; align-items: center; justify-content: center;
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
  }
  .close-btn:hover { background: var(--surface-strong); color: var(--text); }
  #messages {
    flex: 1; overflow-y: auto; padding: 18px 16px 10px;
    display: flex; flex-direction: column; gap: 10px;
    background: transparent;
  }
  .bubble {
    max-width: 85%; padding: 11px 14px;
    border-radius: 16px; line-height: 1.5;
    font-size: 13.5px; white-space: pre-wrap; word-break: break-word;
    animation: fadeIn .18s ease;
  }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: none; }
  }
  .bubble.piya {
    align-self: flex-start;
    background: var(--surface-strong);
    backdrop-filter: blur(16px) saturate(1.2);
    -webkit-backdrop-filter: blur(16px) saturate(1.2);
    border: 1px solid var(--border);
    border-bottom-left-radius: 6px;
  }
  .bubble.user {
    align-self: flex-end;
    background: var(--user-soft);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    color: var(--text);
    border: 1px solid var(--border);
    border-bottom-right-radius: 6px;
  }
  .bubble.thinking {
    align-self: flex-start;
    background: var(--surface-strong);
    backdrop-filter: blur(16px) saturate(1.2);
    -webkit-backdrop-filter: blur(16px) saturate(1.2);
    border: 1px solid var(--border);
    border-bottom-left-radius: 6px;
    padding: 12px 16px;
  }
  .typing-dots {
    display: flex; align-items: center; gap: 5px; height: 16px;
  }
  .typing-dots span {
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--piya);
    opacity: 0.35;
    animation: typingBounce 1.2s ease-in-out infinite;
  }
  .typing-dots span:nth-child(2) { animation-delay: 0.15s; }
  .typing-dots span:nth-child(3) { animation-delay: 0.3s; }
  @keyframes typingBounce {
    0%, 60%, 100% { transform: translateY(0); opacity: 0.35; }
    30% { transform: translateY(-5px); opacity: 1; }
  }
  .bubble strong { font-weight: 600; }
  .composer {
    padding: 12px 16px 16px;
    background: var(--surface-strong);
    backdrop-filter: blur(24px) saturate(1.4);
    -webkit-backdrop-filter: blur(24px) saturate(1.4);
    border-top: 1px solid var(--border);
    -webkit-app-region: no-drag;
  }
  .input-row {
    display: flex; gap: 10px; align-items: center;
    background: var(--surface);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid var(--border);
    border-radius: 14px; padding: 10px 10px 10px 14px;
  }
  textarea {
    flex: 1; border: none; outline: none; resize: none;
    background: transparent; font: inherit; font-size: 14px;
    min-height: 24px; max-height: 120px; line-height: 1.45;
    color: var(--text);
    padding: 4px 0;
    margin: 0;
  }
  #send {
    border: none; border-radius: 10px; padding: 9px 16px;
    background: var(--piya); color: white; font-weight: 600;
    font-size: 12px; cursor: pointer;
    box-shadow: 0 2px 10px rgba(236, 72, 153, 0.35);
    min-width: 64px; min-height: 34px;
    display: inline-flex; align-items: center; justify-content: center;
    transition: transform 0.15s ease, filter 0.15s ease, opacity 0.15s ease;
  }
  #send:hover:not(:disabled) { filter: brightness(1.05); }
  #send:active:not(:disabled) { transform: scale(0.98); }
  #send:disabled { opacity: 0.72; cursor: default; }
  #send .send-spinner {
    display: none; width: 16px; height: 16px;
    border: 2px solid rgba(255, 255, 255, 0.35);
    border-top-color: white;
    border-radius: 50%;
    animation: sendSpin 0.65s linear infinite;
  }
  #send.sending .send-label { display: none; }
  #send.sending .send-spinner { display: block; }
  @keyframes sendSpin { to { transform: rotate(360deg); } }
  body.is-sending, body.is-sending * { cursor: default !important; }
  .input-row.is-sending { opacity: 0.88; }
  .hint {
    margin-top: 8px; font-size: 11px; color: var(--muted); text-align: center;
  }
  .settings-btn {
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--muted);
    height: 28px; border-radius: 14px;
    font-size: 11px; font-weight: 600; letter-spacing: 0.02em;
    padding: 0 10px; cursor: pointer;
    flex-shrink: 0; -webkit-app-region: no-drag;
    display: flex; align-items: center; justify-content: center;
  }
  .settings-btn:hover { background: var(--surface-strong); color: var(--text); }
  .settings-screen {
    display: none; flex-direction: column; flex: 1; overflow: hidden;
  }
  .settings-screen.open { display: flex; }
  .chat-screen {
    display: flex; flex-direction: column; flex: 1; min-height: 0;
  }
  .chat-screen.hidden { display: none; }
  .settings-header {
    padding: 14px 16px 10px;
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 10px;
    background: var(--surface-strong);
  }
  .settings-header h2 { margin: 0; font-size: 15px; font-weight: 600; flex: 1; }
  .settings-back {
    border: 1px solid var(--border); background: var(--surface);
    color: var(--text); border-radius: 8px; padding: 6px 10px;
    font-size: 12px; cursor: pointer; -webkit-app-region: no-drag;
  }
  .settings-body {
    flex: 1; overflow-y: auto; padding: 14px 16px 16px;
  }
  .settings-intro {
    font-size: 12px; color: var(--muted); line-height: 1.5; margin: 0 0 14px;
  }
  .mcp-list { display: flex; flex-direction: column; gap: 10px; }
  .mcp-card {
    border: 1px solid var(--border); border-radius: 12px;
    background: var(--surface); padding: 12px;
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  }
  .mcp-card-head {
    display: flex; align-items: center; gap: 8px; margin-bottom: 10px;
  }
  .mcp-card-head input[type="text"] {
    flex: 1; border: 1px solid var(--border); border-radius: 8px;
    padding: 7px 10px; font: inherit; font-size: 13px;
    background: var(--surface-strong); color: var(--text);
  }
  .mcp-card label { display: block; font-size: 11px; color: var(--muted); margin-bottom: 4px; }
  .mcp-card input, .mcp-card textarea {
    width: 100%; border: 1px solid var(--border); border-radius: 8px;
    padding: 7px 10px; font: inherit; font-size: 12px;
    background: var(--surface-strong); color: var(--text);
    margin-bottom: 8px; box-sizing: border-box;
  }
  .mcp-card textarea { min-height: 52px; resize: vertical; font-family: ui-monospace, monospace; }
  .mcp-card-actions { display: flex; justify-content: space-between; align-items: center; }
  .mcp-remove {
    border: none; background: transparent; color: #ef4444;
    font-size: 12px; cursor: pointer; padding: 0;
  }
  .settings-toolbar {
    display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap;
  }
  .settings-toolbar button {
    border: 1px solid var(--border); background: var(--surface);
    color: var(--text); border-radius: 10px; padding: 8px 14px;
    font-size: 12px; font-weight: 600; cursor: pointer;
  }
  .settings-toolbar button.primary {
    background: var(--piya); color: white; border-color: transparent;
    box-shadow: 0 2px 10px rgba(236, 72, 153, 0.35);
  }
  .settings-status {
    margin-top: 10px; font-size: 11px; color: var(--muted); min-height: 16px;
  }
  .settings-status.ok { color: #16a34a; }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="avatar"></div>
    <div class="title-block">
      <h1>Piya</h1>
      <p id="subtitle">Ask me anything</p>
    </div>
    <div class="mode-switch">
      <button id="mode-chat" type="button" class="active">Chat</button>
      <button id="mode-task" type="button" class="task">Task</button>
    </div>
    <button id="settings-open" type="button" class="settings-btn" title="MCP Settings">MCP</button>
    <button id="close" type="button" class="close-btn" title="Close (Esc)">×</button>
  </header>

  <div id="chat-screen" class="chat-screen">
    <div id="messages"></div>
    <div class="composer">
      <div class="input-row">
        <textarea id="input" rows="1" placeholder="Ask Piya anything…" autofocus></textarea>
        <button id="send" type="button">
          <span class="send-label">Send</span>
          <span class="send-spinner" aria-hidden="true"></span>
        </button>
      </div>
      <div class="hint" id="hint">Chat mode — Esc or × to close · menu bar toggles</div>
    </div>
  </div>

  <div id="settings-screen" class="settings-screen">
    <div class="settings-header">
      <button id="settings-back" type="button" class="settings-back">← Back</button>
      <h2>MCP Servers</h2>
    </div>
    <div class="settings-body">
      <p class="settings-intro">
        Connect external MCP servers so Piya can use their tools (Notion, GitHub, site-tracker, etc.).
        Config is saved to <code>data/mcp.json</code>.
      </p>
      <div id="mcp-list" class="mcp-list"></div>
      <div class="settings-toolbar">
        <button id="mcp-add" type="button">+ Add server</button>
        <button id="mcp-save" type="button" class="primary">Save</button>
      </div>
      <div id="settings-status" class="settings-status"></div>
    </div>
  </div>
</div>
<script>
  const messagesEl = document.getElementById('messages');
  const input = document.getElementById('input');
  const sendBtn = document.getElementById('send');
  const subtitle = document.getElementById('subtitle');
  const hint = document.getElementById('hint');
  const modeChatBtn = document.getElementById('mode-chat');
  const modeTaskBtn = document.getElementById('mode-task');
  const closeBtn = document.getElementById('close');
  const inputRow = document.querySelector('.input-row');
  const chatScreen = document.getElementById('chat-screen');
  const settingsScreen = document.getElementById('settings-screen');
  const settingsOpenBtn = document.getElementById('settings-open');
  const settingsBackBtn = document.getElementById('settings-back');
  const mcpListEl = document.getElementById('mcp-list');
  const mcpAddBtn = document.getElementById('mcp-add');
  const mcpSaveBtn = document.getElementById('mcp-save');
  const settingsStatus = document.getElementById('settings-status');

  let currentMode = 'chat';
  let thinkingEl = null;
  let sending = false;
  let mcpDraft = {};
  let mcpCardSeq = 0;

  function renderMarkdown(text) {
    return text
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  }

  function addBubble(role, text) {
    const el = document.createElement('div');
    el.className = 'bubble ' + role;
    el.innerHTML = renderMarkdown(text);
    messagesEl.appendChild(el);
    messagesEl.scrollTop = messagesEl.scrollHeight;
    return el;
  }

  function clearMessages() {
    messagesEl.innerHTML = '';
    thinkingEl = null;
  }

  function setMode(mode, notify) {
    currentMode = mode;
    modeChatBtn.classList.toggle('active', mode === 'chat');
    modeTaskBtn.classList.toggle('active', mode === 'task');
    if (mode === 'chat') {
      subtitle.textContent = 'Ask me anything';
      input.placeholder = 'Ask Piya anything…';
      hint.innerHTML = 'Chat mode — Esc or × to close · menu bar toggles';
    } else {
      subtitle.textContent = 'Assign tasks & schedules';
      input.placeholder = 'Describe a task, schedule, or memory…';
      hint.innerHTML = 'Task mode — Esc or × to close · menu bar toggles';
    }
    if (notify) {
      window.ipc.postMessage(JSON.stringify({ type: 'set_mode', mode }));
    }
    input.focus();
  }

  window.boot = function(data) {
    const payload = data || {};
    const history = payload.messages || (Array.isArray(data) ? data : []);
    clearMessages();
    setMode(payload.mode || 'chat', false);
    history.forEach(m => addBubble(m.role, m.text));
    if (payload.openSettings) {
      openSettings();
    } else {
      input.focus();
    }
  };

  window.onReply = function(text) {
    setSending(false);
    hideThinking();
    addBubble('piya', text);
  };

  window.setSending = function(active) {
    sending = !!active;
    sendBtn.disabled = sending;
    sendBtn.classList.toggle('sending', sending);
    input.disabled = sending;
    document.body.classList.toggle('is-sending', sending);
    inputRow.classList.toggle('is-sending', sending);
  };

  window.showThinking = function() {
    hideThinking();
    thinkingEl = document.createElement('div');
    thinkingEl.className = 'bubble thinking piya';
    thinkingEl.innerHTML = '<div class="typing-dots" aria-label="Piya is thinking"><span></span><span></span><span></span></div>';
    messagesEl.appendChild(thinkingEl);
    messagesEl.scrollTop = messagesEl.scrollHeight;
  };

  window.hideThinking = function() {
    if (thinkingEl) {
      thinkingEl.remove();
      thinkingEl = null;
    }
  };

  function submit() {
    const text = input.value.trim();
    if (!text || sending) return;
    addBubble('user', text);
    input.value = '';
    input.style.height = 'auto';
    setSending(true);
    if (currentMode === 'chat') showThinking();
    window.ipc.postMessage(JSON.stringify({ type: 'send', text, mode: currentMode }));
  }

  function closePanel() {
    window.ipc.postMessage(JSON.stringify({ type: 'close' }));
  }

  function openSettings() {
    chatScreen.classList.add('hidden');
    settingsScreen.classList.add('open');
    settingsStatus.textContent = '';
    settingsStatus.className = 'settings-status';
    window.ipc.postMessage(JSON.stringify({ type: 'get_mcp' }));
  }
  window.openSettingsPanel = openSettings;

  function closeSettings() {
    settingsScreen.classList.remove('open');
    chatScreen.classList.remove('hidden');
    input.focus();
  }

  function envToText(env) {
    if (!env || typeof env !== 'object') return '';
    return Object.entries(env).map(([k, v]) => `${k}=${v}`).join('\n');
  }

  function textToEnv(text) {
    const env = {};
    for (const line of text.split('\n')) {
      const trimmed = line.trim();
      if (!trimmed || trimmed.startsWith('#')) continue;
      const idx = trimmed.indexOf('=');
      if (idx <= 0) continue;
      env[trimmed.slice(0, idx).trim()] = trimmed.slice(idx + 1).trim();
    }
    return env;
  }

  function renderMcpCards() {
    mcpListEl.innerHTML = '';
    const names = Object.keys(mcpDraft);
    if (names.length === 0) {
      mcpListEl.innerHTML = '<p class="settings-intro">No MCP servers yet. Click “Add server”.</p>';
      return;
    }
    for (const name of names) {
      const entry = mcpDraft[name];
      const cardId = `mcp-${++mcpCardSeq}`;
      const card = document.createElement('div');
      card.className = 'mcp-card';
      card.dataset.name = name;
      card.innerHTML = `
        <div class="mcp-card-head">
          <input type="text" class="mcp-name" value="${escapeAttr(name)}" placeholder="server-name" />
          <label><input type="checkbox" class="mcp-enabled" ${entry.enabled !== false ? 'checked' : ''} /> Enabled</label>
        </div>
        <label>Command</label>
        <input type="text" class="mcp-command" value="${escapeAttr(entry.command || '')}" placeholder="node" />
        <label>Args (one per line)</label>
        <textarea class="mcp-args" placeholder="/path/to/server.js">${escapeHtml((entry.args || []).join('\n'))}</textarea>
        <label>Env (KEY=value, one per line)</label>
        <textarea class="mcp-env" placeholder="API_KEY=...">${escapeHtml(envToText(entry.env))}</textarea>
        <div class="mcp-card-actions">
          <button type="button" class="mcp-remove">Remove</button>
        </div>`;
      card.querySelector('.mcp-remove').addEventListener('click', () => {
        syncMcpDraftFromDom();
        delete mcpDraft[name];
        renderMcpCards();
      });
      mcpListEl.appendChild(card);
    }
  }

  function escapeAttr(s) {
    return String(s).replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;');
  }

  function escapeHtml(s) {
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }

  function syncMcpDraftFromDom() {
    const next = {};
    for (const card of mcpListEl.querySelectorAll('.mcp-card')) {
      const name = card.querySelector('.mcp-name').value.trim();
      if (!name) continue;
      next[name] = {
        command: card.querySelector('.mcp-command').value.trim(),
        args: card.querySelector('.mcp-args').value.split('\n').map(s => s.trim()).filter(Boolean),
        env: textToEnv(card.querySelector('.mcp-env').value),
        enabled: card.querySelector('.mcp-enabled').checked,
      };
    }
    mcpDraft = next;
    return mcpDraft;
  }

  window.loadMcpConfig = function(cfg) {
    mcpDraft = (cfg && cfg.mcpServers) ? structuredClone(cfg.mcpServers) : {};
    renderMcpCards();
  };

  window.onMcpSaved = function() {
    settingsStatus.textContent = 'Saved — new tools apply on your next message.';
    settingsStatus.className = 'settings-status ok';
  };

  function saveMcp() {
    const servers = syncMcpDraftFromDom();
    for (const [name, entry] of Object.entries(servers)) {
      if (!entry.command) {
        settingsStatus.textContent = `“${name}” needs a command.`;
        settingsStatus.className = 'settings-status';
        return;
      }
    }
    window.ipc.postMessage(JSON.stringify({ type: 'save_mcp', servers }));
  }

  modeChatBtn.addEventListener('click', () => setMode('chat', true));
  modeTaskBtn.addEventListener('click', () => setMode('task', true));
  closeBtn.addEventListener('click', closePanel);
  settingsOpenBtn.addEventListener('click', openSettings);
  settingsBackBtn.addEventListener('click', closeSettings);
  mcpAddBtn.addEventListener('click', () => {
    syncMcpDraftFromDom();
    let base = 'server';
    let i = 1;
    while (mcpDraft[`${base}${i}`]) i += 1;
    mcpDraft[`${base}${i}`] = { command: '', args: [], env: {}, enabled: true };
    renderMcpCards();
  });
  mcpSaveBtn.addEventListener('click', saveMcp);
  sendBtn.addEventListener('click', submit);
  input.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') {
      e.preventDefault();
      if (settingsScreen.classList.contains('open')) {
        closeSettings();
      } else {
        closePanel();
      }
      return;
    }
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      submit();
    }
  });
  input.addEventListener('input', () => {
    input.style.height = 'auto';
    input.style.height = Math.min(input.scrollHeight, 120) + 'px';
  });

  if (window.__PIYA_BOOT__) {
    window.boot(window.__PIYA_BOOT__);
  }
</script>
</body>
</html>
