[package]
name = "piya"
version = "0.2.0"
edition = "2021"
description = "Continuous AI agent with vector memory and an explicit OPPAR improvement loop"
readme = "README.md"
license = "MIT"
repository = "https://github.com/HeroicCommit/piya"

[lib]
name = "piya"
crate-type = ["lib", "cdylib", "staticlib"]

[lints.rust]
unexpected_cfgs = "allow"

[[bin]]
name = "piya"
path = "src/main.rs"

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"

[features]
default = ["legacy-ui"]
# tao/wry menu bar + chat panel. SwiftUI builds should use --no-default-features.
legacy-ui = ["dep:tray-icon", "dep:tao", "dep:wry"]

[dependencies]
anyhow = "1"
async-openai = "0.28"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
colored = "3"
crossterm = "0.28"
dotenvy = "0.15"
inquire = "0.7"
regex = "1"
ratatui = "0.29"
reqwest = { version = "0.12", features = ["json"] }
rusqlite = { version = "0.32", features = ["bundled"] }
scraper = "0.22"
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "time", "sync"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uniffi = { version = "0.29", features = ["cli"] }
uuid = { version = "1", features = ["v4"] }
lancedb = "0.31"
arrow-array = "58"
arrow-schema = "58"
futures = "0.3"

[target.'cfg(target_os = "macos")'.dependencies]
tray-icon = { version = "0.19", optional = true }
tao = { version = "0.31", optional = true, default-features = false, features = ["rwh_06"] }
wry = { version = "0.47", optional = true }
objc = "0.2"
cocoa = "0.26"
objc2-core-foundation = { version = "0.3", features = ["CFRunLoop"] }
mac-notification-sys = "0.6"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
